name: CI

on:
  # `main` es la rama de integración real: es donde se mezclan los PR y desde
  # donde se ramifica. Hasta ahora este workflow solo escuchaba en `release`
  # —una rama que ni siquiera existe en el remoto—, así que CI no llegaba a
  # ejecutarse sobre ningún PR. Se mantiene `release` para no romper el flujo
  # de publicación el día que se use.
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  # Sin esto, la única forma de volver a lanzar CI sobre una rama es empujar
  # otro commit: reapuntar la base de un PR es un evento `edited`, que no está
  # entre los tipos por defecto de `pull_request`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trainingzone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trainingzone?schema=public
      AUTH_SECRET: ci-secret-no-usar-en-produccion
      NEXTAUTH_URL: http://localhost:3000
      # RB-RES-005: fijada explícitamente para que la ventana de cancelación no
      # dependa del entorno del runner.
      CANCELLATION_WINDOW_HOURS: "24"
      # Las claves de Stripe se dejan SIN definir a propósito: /planes debe
      # arrancar en modo demo, que es lo que verifica planes-gateo.spec.ts.
      #
      # Eso es verdad pero incompleta: alta-comercial.spec.ts (4 tests) y
      # alta-completa-gimnasio.spec.ts (9 tests) necesitan justo lo contrario,
      # STRIPE_SECRET_KEY y STRIPE_WEBHOOK_SECRET presentes, para probar el
      # alta pago-primero (compra → webhook firmado → activación). Las dos
      # condiciones no caben en el mismo job, así que esos 13 tests se
      # saltaban enteros aquí y nadie lo veía. El job `e2e-pago`, más abajo,
      # corre esos specs con sus propias claves de usar y tirar.
      #
      # E10-07: la comprobación de arranque exige declarar la región de la base
      # de datos y que coincida con la documentada. `npm run start` corre en
      # modo producción, así que sin esto el servidor no arranca en CI — y ese
      # es justamente el comportamiento que la historia pide. Se declara aquí
      # para que CI ejercite el camino real en vez de una excepción.
      DATA_REGION: frankfurt
      # E10-20: las fotos de composición corporal viven fuera de la base de
      # datos, cifradas. Clave de usar y tirar del runner: en producción se
      # genera con `openssl rand -base64 32` y perderla es perder las fotos.
      PROGRESS_PHOTO_KEY: Y2ktb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=
      # E3 · `flujos.spec.ts` mueve el motor de flujos por su endpoint de verdad
      # (`/api/flujos/cron`), que falla cerrado sin secreto. Sin esta variable el
      # spec no falla: SE SALTA ENTERO, que es un verde que no prueba nada — el
      # mismo punto ciego que ya tuvo el alta pago-primero antes del job
      # `e2e-pago`. De usar y tirar, igual que el resto de este bloque.
      JOBS_CRON_SECRET: cron-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Explícito: por defecto la clave sale del glob `**/package-lock.json`,
          # que desde E7-01 también casa con `apps/mobile/package-lock.json`, y
          # entonces tocar la app invalidaba la caché de la web.
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # INF-04 · Explícito y antes del build. `next build` también comprueba
      # tipos, pero solo de lo que entra en el bundle: `scripts/`, `prisma/` y
      # `e2e/` se quedan fuera y un error ahí llegaba a main sin que nada lo viera.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Migraciones y datos de demo
        run: |
          npx prisma migrate deploy
          npm run db:seed

      # INF-03 · El arranque de plataforma tiene que NEGARSE sobre una base con
      # datos de demo, incluso con --force. Aquí la base acaba de sembrarse: si
      # el script termina bien, la guarda está rota.
      - name: El arranque de plataforma se niega sobre datos de demo
        env:
          PLATFORM_ORG_SLUG: apta-plataforma-ci
          PLATFORM_ADMIN_EMAIL: plataforma@ci.invalid
        run: |
          if npm run -s bootstrap:plataforma -- --force; then
            echo "::error::bootstrap:plataforma se ejecutó sobre una base con datos de demo"
            exit 1
          fi

      # Después de migrar: los tests de los reconciliadores de Stripe Billing
      # montan su propia organización contra la base real, porque el riesgo que
      # cubren (reentregas y dunning) solo se manifiesta en lo que queda escrito.
      # E7-05 · los mismos tests, midiendo cobertura y publicándola en el
      # resumen del workflow. Sin umbral que rompa: primero se mide. La medición
      # usa la cobertura experimental de node:test sobre el cargador de tsx —se
      # comprobó que el mapeo de fuentes funciona, así que no hace falta c8—.
      - name: Tests unitarios y cobertura
        run: npm run test:unit:coverage

      - name: Build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # `npm run start` lo arranca el propio webServer de playwright.config.ts.
      - name: Tests e2e
        run: npm run test:e2e

      - name: Guardar informe de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # El punto ciego de CI · el alta pago-primero (compra → webhook firmado →
  # activación de contraseña → puesta en marcha completa) no cabía en `verify`:
  # planes-gateo.spec.ts exige que STRIPE_SECRET_KEY esté AUSENTE para probar
  # el modo demo de /planes, y alta-comercial.spec.ts / alta-completa-gimnasio.spec.ts
  # exigen que esté PRESENTE junto con STRIPE_WEBHOOK_SECRET para probar el
  # camino real. Metidos en el mismo job, una de las dos condiciones pierde y
  # los 13 tests del alta pago-primero se saltaban enteros sin que ningún job
  # se pusiera en rojo por ello. Job aparte, con sus propias claves.
  #
  # No hacen falta credenciales reales de Stripe: los specs firman sus propios
  # eventos de webhook con el mismo secreto que el endpoint usa para
  # verificarlos, y verificar una firma es criptografía local, no una llamada
  # a la API de Stripe.
  #
  # Paralelo a `verify` y sin `needs:`, igual que `mobile`: un fallo del camino
  # de pago no debe ocultar el resultado de la web ni al revés.
  e2e-pago:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trainingzone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trainingzone?schema=public
      AUTH_SECRET: ci-secret-no-usar-en-produccion
      NEXTAUTH_URL: http://localhost:3000
      # RB-RES-005: fijada explícitamente para que la ventana de cancelación no
      # dependa del entorno del runner.
      CANCELLATION_WINDOW_HOURS: "24"
      # E10-07: la comprobación de arranque exige declarar la región de la base
      # de datos y que coincida con la documentada. `npm run start` corre en
      # modo producción, así que sin esto el servidor no arranca en CI — y ese
      # es justamente el comportamiento que la historia pide. Se declara aquí
      # para que CI ejercite el camino real en vez de una excepción.
      DATA_REGION: frankfurt
      # E10-20: las fotos de composición corporal viven fuera de la base de
      # datos, cifradas. Clave de usar y tirar del runner: en producción se
      # genera con `openssl rand -base64 32` y perderla es perder las fotos.
      PROGRESS_PHOTO_KEY: Y2ktb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=
      # De usar y tirar, solo para este job: es justo lo que `verify` omite a
      # propósito. Sin llamada real a Stripe — ver el comentario del job.
      STRIPE_SECRET_KEY: sk_test_solo_para_ci_0000
      STRIPE_WEBHOOK_SECRET: whsec_solo_para_ci_0000
      JOBS_CRON_SECRET: cron-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Migraciones y datos de demo
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # `npm run start` lo arranca el propio webServer de playwright.config.ts.
      # Solo los tres specs del alta pago-primero: el resto ya corre en `verify`.
      - name: Tests e2e — alta pago-primero
        run: npx playwright test e2e/alta-comercial.spec.ts e2e/alta-completa-gimnasio.spec.ts e2e/notifications.spec.ts

      - name: Guardar informe de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pago
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # E7-02 · La app móvil se comprueba en cada cambio, en su propio job.
  #
  # Paralelo a `verify` y sin `needs:`, así que los dos corren a la vez y cada
  # uno informa por separado: un fallo de la app no oculta el resultado de la
  # web ni al revés. Y sin base de datos ni Playwright — la app no los usa: su
  # frontera de red se dobla en el propio test (`src/test/server.ts`), así que
  # no hay nada que levantar. El job entero baja de dos minutos.
  mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # El lockfile de la app, no el de la raíz: son dos árboles de
          # dependencias distintos y la app no está en un workspace de npm.
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests y cobertura
        run: npm run test:ci

      # E7-04 · la cobertura se publica donde se lee: el resumen del workflow,
      # que es la primera pantalla al terminar CI. `if: always()` porque el
      # número interesa igual —o más— cuando algo ha fallado. Los umbrales los
      # aplica Jest en el paso de arriba; esto solo informa.
      - name: Publicar cobertura en el resumen
        if: always()
        run: node scripts/coverage-summary.mjs

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # INF-04 · Producción arranca SIN seed, y hasta ahora ningún job lo probaba:
  # `verify` y `e2e-pago` siembran justo después de migrar, así que una
  # migración que solo funciona sobre datos, o una página que revienta con la
  # base vacía, pasaba CI y se descubría el día del despliegue.
  #
  # Este job reproduce el primer despliegue de Render con la mayor fidelidad
  # posible: propietario NO superusuario (como el que da Render), los roles
  # creados con el SQL de docs/OPERACIONES.md §7.2 extraído del propio documento
  # —si alguien lo edita y lo rompe, esto se pone en rojo—, migraciones con el
  # propietario, y la app arrancando con `apta_app`.
  arranque-limpio:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      # Solo `prisma migrate deploy` usa la del propietario (prisma.config.ts).
      DATABASE_MIGRATION_URL: postgresql://trainingzone_owner:owner-ci@localhost:5432/trainingzone?schema=public
      DATABASE_URL: postgresql://apta_app:app-ci@localhost:5432/trainingzone?schema=public
      DATA_RETENTION_DATABASE_URL: postgresql://apta_mantenimiento:mant-ci@localhost:5432/trainingzone?schema=public
      AUTH_SECRET: ci-secret-no-usar-en-produccion
      NEXTAUTH_URL: http://localhost:3000
      CANCELLATION_WINDOW_HOURS: "24"
      DATA_REGION: frankfurt
      PROGRESS_PHOTO_KEY: Y2ktb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=
      JOBS_CRON_SECRET: cron-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Base vacía con propietario no superusuario (como Render)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE trainingzone_owner LOGIN CREATEROLE PASSWORD 'owner-ci';
          CREATE DATABASE trainingzone OWNER trainingzone_owner;
          SQL

      # El SQL sale de OPERACIONES.md, no de una copia: lo que se prueba es lo
      # que va a ejecutar una persona en producción.
      - name: Roles de BD (OPERACIONES.md §7.2, tal cual)
        env:
          PGUSER: trainingzone_owner
          PGPASSWORD: owner-ci
          PGDATABASE: trainingzone
        run: |
          set -euo pipefail
          extraer() {
            awk -v tag="$1" 'index($0, "<!-- " tag) == 1 { f = 1; next }
              f && /^```sql/ { g = 1; next }
              g && /^```/ { exit }
              g { print }' docs/OPERACIONES.md
          }
          for bloque in sql:roles sql:post-migracion sql:comprobacion; do
            extraer "$bloque" > "/tmp/${bloque#sql:}.sql"
            test -s "/tmp/${bloque#sql:}.sql" || { echo "::error::No encuentro el bloque $bloque en OPERACIONES.md"; exit 1; }
          done
          psql -v ON_ERROR_STOP=1 -f /tmp/roles.sql
          # Idempotente: el runbook dice que se puede repetir.
          psql -v ON_ERROR_STOP=1 -f /tmp/roles.sql
          # En producción las contraseñas van con \password; aquí, de usar y tirar.
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE apta_app PASSWORD 'app-ci'" \
                                  -c "ALTER ROLE apta_mantenimiento PASSWORD 'mant-ci'"

      - name: Migraciones con el propietario, sin seed
        run: npx prisma migrate deploy

      - name: Permisos después de migrar (AuditLog append-only para la app)
        env:
          PGUSER: trainingzone_owner
          PGPASSWORD: owner-ci
          PGDATABASE: trainingzone
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f /tmp/post-migracion.sql
          resultado=$(psql -v ON_ERROR_STOP=1 -At -f /tmp/comprobacion.sql)
          echo "Comprobación: $resultado"
          if [ "$resultado" != "t|f|f|t|f|t" ]; then
            echo "::error::Permisos de BD inesperados ($resultado, se esperaba t|f|f|t|f|t). Ver OPERACIONES.md §7.2."
            exit 1
          fi
          vacia=$(psql -At -c 'SELECT (SELECT count(*) FROM "Organization") + (SELECT count(*) FROM "User")')
          test "$vacia" = "0" || { echo "::error::La base no está vacía después de migrar ($vacia filas)"; exit 1; }

      - name: Arranque de plataforma, dos veces (idempotente)
        env:
          PLATFORM_ORG_SLUG: apta-plataforma-ci
          PLATFORM_ADMIN_EMAIL: plataforma@ci.invalid
          PGUSER: trainingzone_owner
          PGPASSWORD: owner-ci
          PGDATABASE: trainingzone
        run: |
          set -euo pipefail
          # --force porque aquí NODE_ENV no es production; corre con apta_app.
          npm run -s bootstrap:plataforma -- --force > /dev/null
          npm run -s bootstrap:plataforma -- --force
          filas=$(psql -At -c "SELECT (SELECT count(*) FROM \"Organization\" WHERE \"platformStatus\" = 'ACTIVE') || '|' ||
                                      (SELECT count(*) FROM \"User\" WHERE role = 'PLATFORM_ADMIN') || '|' ||
                                      (SELECT count(*) FROM \"Invitation\")")
          echo "Organizaciones activas | admins | invitaciones: $filas"
          test "$filas" = "1|1|1" || { echo "::error::El arranque de plataforma no es idempotente ($filas)"; exit 1; }

      - name: Build
        run: npm run build

      # /api/health lo añade la pista P1. Mientras la ruta no exista en el
      # checkout, se comprueba lo que se puede (la app sirve y apta_app conecta)
      # y se avisa. En cuanto exista, nada que no sea un 200 vale: la
      # transición se cierra sola, sin tener que acordarse de tocar esto.
      # Ojo: hoy el proxy redirige a /login (307) todo lo que no es público, así
      # que la ruta tiene que declararse pública o Render no la dará por buena.
      - name: Arrancar la app contra /api/health
        run: |
          set -uo pipefail
          npm run start > server.log 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "GET /api/health → HTTP $code"
          cat /tmp/health.json 2>/dev/null; echo
          if [ -d src/app/api/health ]; then
            [ "$code" = "200" ] && exit 0
            echo "::error::/api/health respondió $code con la base recién migrada y sin seed"
            tail -n 100 server.log
            exit 1
          fi
          echo "::warning::src/app/api/health no existe todavía (pista P1): se comprueba /login y la conexión de apta_app en su lugar."
          login=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)
          echo "GET /login → HTTP $login"
          psql "${DATABASE_URL%%\?*}" -At -c 'SELECT 1' > /dev/null || { echo "::error::apta_app no conecta"; exit 1; }
          if [ "$login" != "200" ]; then
            echo "::error::La app no sirve /login con la base vacía (HTTP $login)"
            tail -n 100 server.log
            exit 1
          fi

      - name: Guardar el log del servidor
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arranque-limpio-server-log
          path: server.log
          retention-days: 7
          if-no-files-found: ignore

  # INF-04 · Comprobaciones de infraestructura que no necesitan base de datos.
  infra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # `npm run test:unit` solo recorre src/: sin este paso, las pruebas de los
      # scripts de operación no las ejecutaba nadie.
      - name: Tests de los scripts de operación
        run: npx tsx --test scripts/*.test.ts

      # Una variable declarada solo en producción es un staging que no prueba
      # lo que se va a desplegar; un valor literal en vez de `sync: false` es un
      # secreto camino del repo.
      - name: Blueprint de Render coherente
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y -qq python3-yaml
          python3 - <<'PY'
          import sys, yaml
          blueprint = yaml.safe_load(open("render.yaml"))
          webs = {s["name"]: s for s in blueprint["services"] if s["type"] == "web"}
          errores = []
          claves = {n: [e["key"] for e in s.get("envVars", [])] for n, s in webs.items()}
          if len(set(map(tuple, map(sorted, claves.values())))) > 1:
              errores.append(f"los servicios web no declaran las mismas variables: {claves}")
          for nombre, servicio in webs.items():
              for e in servicio.get("envVars", []):
                  if e["key"] == "PROGRESS_PHOTO_DIR":
                      if not str(e.get("value", "")).startswith(servicio["disk"]["mountPath"] + "/"):
                          errores.append(f"{nombre}: PROGRESS_PHOTO_DIR no está dentro del disco")
                  elif e.get("sync") is not False:
                      errores.append(f"{nombre}: {e['key']} no es sync: false")
              if servicio.get("preDeployCommand") != "npx prisma migrate deploy":
                  errores.append(f"{nombre}: preDeployCommand no es npx prisma migrate deploy")
              if any(e["key"] == "NODE_ENV" for e in servicio.get("envVars", [])):
                  errores.append(f"{nombre}: declara NODE_ENV (npm ci se saltaría las devDependencies)")
          for error in errores:
              print(f"::error file=render.yaml::{error}")
          sys.exit(1 if errores else 0)
          PY

      # Primer día: informa, no rompe. Hay que ver primero qué sale; cuando el
      # informe esté limpio, se quita el `exit 0` final y pasa a ser obligatorio.
      - name: npm audit (informativo)
        run: |
          set +e
          npm audit --audit-level=high > audit.txt 2>&1
          code=$?
          {
            echo "## npm audit (--audit-level=high)"
            echo
            if [ "$code" = "0" ]; then
              echo "Sin vulnerabilidades altas ni críticas."
            else
              echo "**Hay vulnerabilidades altas o críticas.** No rompe el build todavía (INF-04)."
            fi
            echo
            echo '```'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          if [ "$code" != "0" ]; then
            echo "::warning::npm audit encuentra vulnerabilidades altas o críticas (ver el resumen del workflow)"
          fi
          exit 0
